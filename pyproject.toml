[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent"
version = "0.1.0"
description = "Agente de QA agnóstico al stack: descubre cada proyecto, ejecuta chequeos y emite un informe con nivel de confianza."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
llm = ["anthropic>=1"]
web = ["playwright>=1.40"]

[project.scripts]
qa-agent = "qa_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
